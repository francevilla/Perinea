  </g>

  <!-- Wordmark -->
  <text x="600" y="330" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="112" font-weight="600" fill="#FAF6F0">Perinea<tspan fill="#D48E6D">.</tspan></text>

