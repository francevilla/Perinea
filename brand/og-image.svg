  <circle cx="1150" cy="40" r="260" fill="#C07A5E" fill-opacity="0.13"/>
  <circle cx="40" cy="620" r="230" fill="#62805F" fill-opacity="0.20"/>

  <!-- Mark centrato (centro ottico a 600,150) -->
